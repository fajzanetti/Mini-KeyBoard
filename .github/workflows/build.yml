name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-yaml
            mingw-w64-ucrt-x86_64-hidapi
            mingw-w64-ucrt-x86_64-pyinstaller

      # A máquina do GitHub não tem o mini teclado. A busca precisa terminar sem erro e sem achar nada.
      - name: Verifica a hidapi
        run: python -c "from mini_keyboard import device, hid; print(hid.find_path(device.VENDOR_ID, device.PRODUCT_IDS, device.VENDOR_USAGE_PAGE))"

      - name: Gera o executável
        run: pyinstaller --noconfirm packaging/mini-keyboard.spec

      # O executável não tem console. Um erro na inicialização abre uma janela com outro título.
      - name: Verifica a inicialização
        run: |
          ./dist/MiniKeyboard.exe &
          sleep 30
          titles="$(powershell -NoProfile -Command "(Get-Process MiniKeyboard).MainWindowTitle" | tr -d '\r')"
          echo "$titles"
          taskkill //F //T //IM MiniKeyboard.exe
          echo "$titles" | grep -qx "Mini Keyboard"

      - uses: actions/upload-artifact@v7
        with:
          name: MiniKeyboard-windows
          path: dist/MiniKeyboard.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Gera o pacote .deb
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="0.0.0+git$(git rev-parse --short HEAD)" ;;
          esac
          packaging/build-deb.sh "$version"

      # O timeout encerra o app. O código 124 indica que o app ainda estava aberto.
      - name: Verifica a instalação e a inicialização
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb xvfb
          status=0
          xvfb-run -a timeout 15 mini-keyboard || status=$?
          test "$status" -eq 124

      - uses: actions/upload-artifact@v7
        with:
          name: mini-keyboard-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publica a release
        run: gh release create "$GITHUB_REF_NAME" MiniKeyboard.exe mini-keyboard_*.deb --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
